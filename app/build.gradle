apply plugin: 'com.android.application'

android {
    compileSdk 34

    defaultConfig {
        applicationId "com.joserp.argonavis"
        minSdkVersion 29
        targetSdkVersion 34
        versionCode 1
        versionName '4.8.1'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    namespace 'com.joserp.argonavis'
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'com.davemorrissey.labs:subsampling-scale-image-view:3.10.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1'
    implementation 'androidx.navigation:navigation-fragment:2.6.0'
    implementation 'androidx.navigation:navigation-ui:2.6.0'
    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    testImplementation 'junit:junit:4.13.2'
    implementation 'org.jsoup:jsoup:1.14.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    //implementation'com.chauthai.swipereveallayout:swipe-reveal-layout:1.4.1'
    implementation 'com.github.chthai64:SwipeRevealLayout:1.4.0'
    implementation "com.leinardi.android:speed-dial:3.3.0"
    implementation("com.google.ai.client.generativeai:generativeai:0.8.0") // Revisa la última versión
    implementation("com.google.guava:guava:31.0.1-android") // Necesaria para ListenableFuture
    implementation 'io.noties.markwon:core:4.6.2' //Necesario para mostrar la info de IA Gemini
}